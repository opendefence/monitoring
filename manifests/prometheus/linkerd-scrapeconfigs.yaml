# Linkerd metrics scraped by the external (prometheus-operator) Prometheus, replacing
# linkerd-viz's bundled Prometheus. Ported from Linkerd's reference scrape config
# (https://linkerd.io/2-edge/tasks/external-prometheus/), with the chart's {{ .Values }}
# rendered to concrete values: linkerdNamespace=linkerd, viz namespace=linkerd-viz,
# proxyContainerName=linkerd-proxy. The `monitoring: prometheus` label is what the
# Prometheus CR's scrapeConfigSelector matches.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: linkerd-controller
  labels:
    monitoring: prometheus
spec:
  kubernetesSDConfigs:
    - role: Pod
      namespaces:
        names:
          - linkerd
          - linkerd-viz
  relabelings:
    - sourceLabels: [__meta_kubernetes_pod_container_port_name]
      action: keep
      regex: admin-http
    - sourceLabels: [__meta_kubernetes_pod_container_name]
      action: replace
      targetLabel: component
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: linkerd-service-mirror
  labels:
    monitoring: prometheus
spec:
  # No-op on a single-cluster install (no service-mirror pods); kept for parity.
  kubernetesSDConfigs:
    - role: Pod
  relabelings:
    - sourceLabels:
        - __meta_kubernetes_pod_label_component
        - __meta_kubernetes_pod_container_port_name
      action: keep
      regex: linkerd-service-mirror;admin-http$
    - sourceLabels: [__meta_kubernetes_pod_container_name]
      action: replace
      targetLabel: component
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: linkerd-proxy
  labels:
    monitoring: prometheus
spec:
  # Cluster-wide: proxies live in every meshed namespace (app-matrix, opendefence-system, …).
  kubernetesSDConfigs:
    - role: Pod
  relabelings:
    - sourceLabels:
        - __meta_kubernetes_pod_container_name
        - __meta_kubernetes_pod_container_port_name
        - __meta_kubernetes_pod_label_linkerd_io_control_plane_ns
      action: keep
      regex: ^linkerd-proxy;linkerd-admin;linkerd$
    - sourceLabels: [__meta_kubernetes_namespace]
      action: replace
      targetLabel: namespace
    - sourceLabels: [__meta_kubernetes_pod_name]
      action: replace
      targetLabel: pod
    # special case k8s' "job" label, to not interfere with prometheus' "job" label
    - sourceLabels: [__meta_kubernetes_pod_label_linkerd_io_proxy_job]
      action: replace
      targetLabel: k8s_job
    - action: labeldrop
      regex: __meta_kubernetes_pod_label_linkerd_io_proxy_job
    # linkerd_io_proxy_* -> *
    - action: labelmap
      regex: __meta_kubernetes_pod_label_linkerd_io_proxy_(.+)
    - action: labeldrop
      regex: __meta_kubernetes_pod_label_linkerd_io_proxy_(.+)
    # linkerd_io_* -> *
    - action: labelmap
      regex: __meta_kubernetes_pod_label_linkerd_io_(.+)
    # copy all pod labels to tmp
    - action: labelmap
      regex: __meta_kubernetes_pod_label_(.+)
      replacement: __tmp_pod_label_$1
    # take linkerd_io_ prefixed tmp labels and copy them without the prefix
    - action: labelmap
      regex: __tmp_pod_label_linkerd_io_(.+)
      replacement: __tmp_pod_label_$1
    - action: labeldrop
      regex: __tmp_pod_label_linkerd_io_(.+)
    # copy tmp labels into real labels
    - action: labelmap
      regex: __tmp_pod_label_(.+)
