loki:
  auth_enabled: false
  commonConfig:
    path_prefix: /var/loki
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 720h
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem
  ruler:
    enable_api: true
  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules

deploymentMode: Monolithic

minio:
  enabled: false

singleBinary:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 512Mi
  persistence:
    enabled: true
    size: 10Gi
    accessModes:
      - ReadWriteOnce

chunksCache:
  enabled: false
resultsCache:
  enabled: false

backend:
  enabled: false
  replicas: 0
read:
  enabled: false
  replicas: 0
write:
  enabled: false
  replicas: 0

ingester:
  enabled: false
  replicas: 0
querier:
  enabled: false
  replicas: 0
queryFrontend:
  enabled: false
  replicas: 0
queryScheduler:
  enabled: false
  replicas: 0
distributor:
  enabled: false
  replicas: 0
compactor:
  enabled: false
  replicas: 0
indexGateway:
  enabled: false
  replicas: 0
bloomPlanner:
  enabled: false
  replicas: 0
bloomBuilder:
  enabled: false
  replicas: 0
bloomGateway:
  enabled: false
  replicas: 0
