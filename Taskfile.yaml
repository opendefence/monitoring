# Local kind cluster and registries come from opendefence/base.
# The included taskfiles set the registry, cluster, and base defaults.
version: "3"

includes:
  registries:
    aliases: [r]
    taskfile: https://raw.githubusercontent.com/opendefence/base/main/taskfiles/registries.yaml
    dir: "{{.ROOT_DIR}}"
  cluster:
    aliases: [c]
    taskfile: https://raw.githubusercontent.com/opendefence/base/main/taskfiles/cluster.yaml
    dir: "{{.ROOT_DIR}}"
  base:
    taskfile: https://raw.githubusercontent.com/opendefence/base/main/taskfiles/base.yaml
    dir: "{{.ROOT_DIR}}"
  build:
    taskfile: ./taskfiles/build.yaml
    dir: "{{.ROOT_DIR}}"
  monitoring:
    taskfile: ./taskfiles/monitoring.yaml
    dir: "{{.ROOT_DIR}}"

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  up:
    aliases: [dev]
    desc: Start the cluster, deploy the base package, then deploy monitoring
    cmds:
      - task: registries:up
      - task: cluster:create
      - task: registries:connect
      - task: cluster:configure-mirrors
      - task: cluster:document-local-registry
      - task: base:install
        vars:
          BASE_ISSUER: '{{.BASE_ISSUER | default "ca"}}'
      - task: build:deploy

  down:
    desc: Delete the kind cluster and leave the registries running
    cmds:
      - task: registries:disconnect
      - task: cluster:down

  reset:
    desc: Delete the kind cluster, owned registry containers, and anonymous volumes
    cmds:
      - task: down
      - task: registries:down

  status:
    aliases: [s]
    desc: Show cluster, registry, and package status
    cmds:
      - task: cluster:status
      - task: registries:status
      - task: base:status
      - task: monitoring:status
